<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ค้นหาร้านค้าใกล้เคียง</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="14" fill="#185FA5"/>
          <path d="M14 6C10.68 6 8 8.68 8 12c0 4.5 6 10 6 10s6-5.5 6-10c0-3.32-2.68-6-6-6zm0 8a2 2 0 110-4 2 2 0 010 4z" fill="white"/>
        </svg>
        <span>ร้านค้าใกล้เคียง</span>
      </div>
      <div id="store-count-badge" class="badge hidden"></div>
    </div>
  </header>

  <main>
    <div class="sidebar">

      <div class="card" id="card-data">
        <div class="card-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v4H3zM3 10h18v4H3zM3 17h18v4H3z"/></svg>
          ข้อมูลร้านค้า
        </div>
        <p class="hint">ดึงข้อมูลจาก Google Sheet (Sheet: Total_ร้าน)<br>คอลัม H = LAT, I = LONG</p>
        <div class="btn-row">
          <button id="btn-fetch" class="btn btn-primary" onclick="fetchSheet()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
            โหลดข้อมูล
          </button>
          <button class="btn" onclick="toggleManual()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            วาง CSV
          </button>
        </div>
        <div id="load-bar" class="load-bar hidden"><div id="load-bar-inner"></div></div>
        <div id="load-status" class="status-msg"></div>
        <div id="manual-panel" class="hidden">
          <p class="hint" style="margin-top:10px">File → Download → CSV แล้ว copy ทั้งหมดวางด้านล่าง</p>
          <textarea id="csv-input" rows="4" placeholder="วาง CSV ที่นี่..."></textarea>
          <button class="btn btn-primary" onclick="parseCSV()" style="margin-top:8px">โหลดจาก CSV</button>
        </div>
      </div>

      <div class="card" id="card-search">
        <div class="card-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 010 16c-4.5 0-8-4-8-8a8 8 0 018-8z"/></svg>
          พิกัดของคุณ
        </div>
        <div class="input-row">
          <div class="input-group">
            <label>ละติจูด</label>
            <input type="number" id="user-lat" step="0.000001" placeholder="18.7883" />
          </div>
          <div class="input-group">
            <label>ลองจิจูด</label>
            <input type="number" id="user-lng" step="0.000001" placeholder="98.9853" />
          </div>
        </div>
        <div class="radius-row">
          <label>รัศมี</label>
          <input type="range" id="radius-slider" min="1" max="100" value="10" step="1"
            oninput="document.getElementById('radius-out').textContent=this.value+' กม.'" />
          <span id="radius-out">10 กม.</span>
        </div>
        <div class="btn-row" style="margin-top:12px">
          <button class="btn btn-primary" onclick="findNearby()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            ค้นหา
          </button>
          <button class="btn" onclick="useMyLocation()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>
            ตำแหน่งปัจจุบัน
          </button>
        </div>
        <div id="search-status" class="status-msg"></div>
      </div>

      <div id="results-card" class="card hidden">
        <div class="card-label-row">
          <div class="card-label" style="margin:0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            ร้านค้าใกล้เคียง
          </div>
          <span id="result-count" class="result-count"></span>
        </div>
        <div id="store-list"></div>
      </div>

    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
